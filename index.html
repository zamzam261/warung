<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<title>Data Warung</title>
<style>
:root{--bg:#fff;--t:#222;--m:#6b6b6b;--ln:#d6d6d6;--bd:#8a8a8a;--ac:#1f6f43;--act:#fff;--w:#fff4c9;--r:#fbd9d6;--no:#b3261e;--ok:#1f6f43;--hd:#f1f1ee}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--t:#e8e8e8;--m:#9a9a9a;--ln:#3a3a3a;--bd:#666;--ac:#5cb585;--act:#0b0b0b;--w:#46400f;--r:#552320;--no:#f0958e;--ok:#6cc596;--hd:#222}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
h1{font-size:17px;margin:0;padding:9px 12px 2px}
#tabs{display:flex;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#tabs a{padding:10px 14px;color:var(--m);border-bottom:3px solid transparent;font-size:15px}
#tabs a.on{color:var(--t);border-color:var(--ac);font-weight:700}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
fieldset{border:1px solid var(--ln);border-radius:3px;margin:0 0 14px;padding:4px 12px 12px;min-width:0}
legend{font-weight:700;padding:0 4px}
label{display:block;font-size:14px;color:var(--m);margin:10px 0 3px}
label.c{display:flex;gap:8px;align-items:center;color:var(--t);font-size:15px}
input,select,button{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--t)}
input[type=checkbox]{width:auto;margin:0}
button{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600;padding:11px}
button.s{background:var(--bg);color:var(--t);border-color:var(--bd);font-weight:400}
button.d{background:var(--bg);color:var(--no);border-color:var(--no);font-weight:400}
.g{display:flex;gap:10px}.g>*{flex:1;min-width:0}
.wrap{overflow-x:auto;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--hd);text-align:left;font-weight:600;white-space:nowrap}
td,th{padding:7px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
.st td:first-child,.st th:first-child{position:sticky;left:0;background:var(--bg);min-width:120px}
.st th:first-child{background:var(--hd)}
.r{text-align:right}tr.low td{background:var(--w)!important}tr.out td{background:var(--r)!important}
tr.tap{cursor:pointer}
small,.m{color:var(--m);font-size:13px}.sum{font-weight:700;margin:6px 0 10px}
.in{color:var(--ok)}.ou{color:var(--no)}
#msg{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--t);color:var(--bg);padding:10px 12px;border-radius:3px;display:none;z-index:9}
</style></head><body>
<div id="top"><h1>Data Warung</h1><div id="tabs"></div></div><main></main><div id="msg"></div>
<script>
const K='warung_v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{barang:[],trx:[],seq:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Data gagal disimpan. Penyimpanan browser penuh atau diblokir.')}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const q=n=>String(+(+n).toFixed(3));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{s=String(s).replace(/rp|\s/gi,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date()),ms=()=>today().slice(0,8)+'01';
const bn=id=>db.barang.find(x=>x.id==id)||{nama:'(barang dihapus)',satuan:'',kode:''};
function msg(m){const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2500)}
function stokMap(){const m={};db.barang.forEach(b=>m[b.id]={s:b.awal,i:0,o:0});db.trx.forEach(t=>{const x=m[t.bid];if(!x)return;if(t.jenis=='M'){x.s+=t.jml;x.i+=t.jml}else{x.s-=t.jml;x.o+=t.jml}});return m}
const SAT=[['Satuan kecil',['pcs','buah','biji','butir','batang','lembar','potong','porsi','gelas','bungkus','sachet','renteng']],['Kemasan',['botol','kaleng','pak','pack','dus','karton','box','tray','lusin','kodi','rim','bal','karung','sak','tabung','galon','ikat','sisir','ekor','set','pasang','rol']],['Berat dan isi',['gram','ons','kg','ml','liter']]];
const KAT=['Sembako','Makanan Instan','Minuman','Snack','Bumbu','Kebersihan','Rokok','Perlengkapan','Lainnya'];

let tab='stok',fq='',fl=false,eb=null,TD=today(),rd=ms(),rs=today(),rj='',ld=ms(),ls=today();const sel={M:0,K:0},V={};
const TABS=[['stok','Stok'],['barang','Data Barang'],['M','Barang Masuk'],['K','Barang Keluar'],['riwayat','Riwayat'],['laporan','Laporan'],['data','Data / Backup']];
$('#tabs').innerHTML=TABS.map(([k,t])=>`<a id="n_${k}" onclick="tab='${k}';R();scrollTo(0,0)">${t}</a>`).join('');
function R(){const a=document.activeElement,id=a&&a.id;$('main').innerHTML=V[tab]();
 TABS.forEach(([k])=>$('#n_'+k).classList.toggle('on',k==tab));$('#n_'+tab).scrollIntoView({inline:'center',block:'nearest'});
 if(id){const e=document.getElementById(id);if(e){e.focus();try{const n=e.value.length;e.setSelectionRange(n,n)}catch(x){}}}}

V.stok=()=>{const m=stokMap();let nilai=0,low=0;
 const all=db.barang.map(b=>{const x=m[b.id],s=x.s,c=s<=0?'out':s<=b.min?'low':'',n=Math.max(s,0)*b.beli;nilai+=n;if(c)low++;return{b,x,s,c,n}});
 const k=fq.toLowerCase(),L=all.filter(a=>(a.b.nama+a.b.kode+(a.b.kat||'')).toLowerCase().includes(k)&&(!fl||a.c));
 return `<div class=sum>${all.length} jenis barang &nbsp;|&nbsp; Nilai stok ${rp(nilai)} &nbsp;|&nbsp; Perlu restok ${low}</div>
 <input id=fq type=search placeholder="Cari nama, kode, atau kategori" value="${esc(fq)}" oninput="fq=this.value;R()">
 <label class=c><input type=checkbox ${fl?'checked':''} onchange="fl=this.checked;R()"> Hanya stok menipis / habis</label>
 <div class=wrap style="margin-top:8px"><table class=st style="min-width:680px"><tr><th>Nama Barang<th class=r>Stok Awal<th class=r>Masuk<th class=r>Keluar<th class=r>SISA STOK<th class=r>Harga Beli<th class=r>Harga Jual<th class=r>Nilai Stok</tr>
 ${L.map(a=>`<tr class="${a.c}"><td><b>${esc(a.b.nama)}</b><br><small>${esc(a.b.kode)} · ${esc(a.b.kat||'-')}</small><td class=r>${q(a.b.awal)}<td class=r>${q(a.x.i)}<td class=r>${q(a.x.o)}<td class=r><b>${q(a.s)}</b> ${esc(a.b.satuan)}<td class=r>${rp(a.b.beli)}<td class=r>${rp(a.b.jual)}<td class=r>${rp(a.n)}</tr>`).join('')}</table></div>
 ${L.length?'':'<p class=m>Tidak ada barang. Tambahkan lewat menu Data Barang, atau isi data contoh di menu Data / Backup.</p>'}
 <p class=m>Kuning: stok menipis (sama dengan atau di bawah stok minimum). Merah: stok habis.</p>`};

function satField(v){const all=SAT.flatMap(g=>g[1]),cu=v&&!all.includes(v);
 return `<label>Satuan *</label><select id=bs onchange="$('#bso').style.display=this.value=='_'?'block':'none'"><option value="">- pilih satuan -</option>${SAT.map(([g,a])=>`<optgroup label="${g}">${a.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}</optgroup>`).join('')}<option value="_" ${cu?'selected':''}>Lainnya (tulis sendiri)</option></select><input id=bso placeholder="Tulis satuan" value="${cu?esc(v):''}" style="margin-top:6px;display:${cu?'block':'none'}">`}
V.barang=()=>{const b=db.barang.find(x=>x.id==eb)||{kode:'',nama:'',kat:'',satuan:'',beli:'',jual:'',awal:'',min:''};
 const kats=[...new Set(KAT.concat(db.barang.map(x=>x.kat).filter(Boolean)))];
 return `<fieldset><legend>Data Barang</legend><p class=m>${eb?'Mode: mengedit "'+esc(b.nama)+'"':'Mode: tambah barang baru'}. Ketuk baris di tabel bawah untuk mengedit.</p>
 <label>Nama Barang *</label><input id=bn value="${esc(b.nama)}">
 <div class=g><div><label>Kode</label><input id=bk value="${esc(b.kode)}" placeholder="otomatis"></div><div><label>Kategori</label><input id=bt list=kt value="${esc(b.kat)}"></div></div>
 <datalist id=kt>${kats.map(k=>`<option>${esc(k)}</option>`).join('')}</datalist>${satField(b.satuan)}
 <div class=g><div><label>Harga Beli</label><input id=bb inputmode=decimal value="${b.beli}"></div><div><label>Harga Jual</label><input id=bj inputmode=decimal value="${b.jual}"></div></div>
 <div class=g><div><label>Stok Awal</label><input id=ba inputmode=decimal value="${b.awal}"></div><div><label>Stok Minimum</label><input id=bm inputmode=decimal value="${b.min}"></div></div>
 <div class=g style="margin-top:14px"><button onclick=simpanB()>Simpan</button><button class=s onclick="eb=null;R()">Baru / Bersihkan</button>${eb?'<button class=d onclick=hapusB()>Hapus</button>':''}</div></fieldset>
 <div class=wrap><table style="min-width:560px"><tr><th>Nama Barang<th>Kategori<th>Satuan<th class=r>Harga Beli<th class=r>Harga Jual<th class=r>Untung/unit<th class=r>Stok Min</tr>
 ${db.barang.map(x=>`<tr class=tap onclick="eb=${x.id};R();scrollTo(0,0)"><td><b>${esc(x.nama)}</b><br><small>${esc(x.kode)}</small><td>${esc(x.kat||'-')}<td>${esc(x.satuan)}<td class=r>${rp(x.beli)}<td class=r>${rp(x.jual)}<td class=r>${rp(x.jual-x.beli)}<td class=r>${q(x.min)}</tr>`).join('')}</table></div>`};
function simpanB(){const nama=$('#bn').value.trim();if(!nama)return alert('Nama barang wajib diisi.');
 const sat=$('#bs').value=='_'?$('#bso').value.trim():$('#bs').value;if(!sat)return alert('Pilih satuan barang dulu.');
 const beli=num($('#bb').value),jual=num($('#bj').value),awal=num($('#ba').value),min=num($('#bm').value);
 if([beli,jual,awal,min].some(isNaN))return alert('Harga dan stok harus berupa angka.');
 const kode=$('#bk').value.trim().toUpperCase()||'BRG'+String(db.seq).padStart(4,'0');
 if(db.barang.some(x=>x.kode==kode&&x.id!=eb))return alert('Kode '+kode+' sudah dipakai barang lain.');
 const d={kode,nama,kat:$('#bt').value.trim(),satuan:sat,beli,jual,awal,min};
 if(eb)Object.assign(db.barang.find(x=>x.id==eb),d);else db.barang.push({id:db.seq++,...d});
 db.barang.sort((a,b)=>a.nama.localeCompare(b.nama));eb=null;save();R();scrollTo(0,0);msg('Barang tersimpan.')}
function hapusB(){const n=db.trx.filter(t=>t.bid==eb).length;
 if(!confirm('Hapus barang ini?'+(n?'\n\nPERHATIAN: '+n+' transaksi barang ini ikut terhapus.':'')))return;
 db.barang=db.barang.filter(x=>x.id!=eb);db.trx=db.trx.filter(t=>t.bid!=eb);eb=null;save();R()}

function VT(j){const m=stokMap(),M=j=='M',id=sel[j],b=db.barang.find(x=>x.id==id);
 const ks=[...new Set(db.barang.map(x=>x.kat||'Tanpa kategori'))];
 const last=db.trx.filter(t=>t.jenis==j).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id).slice(0,50);
 return `<fieldset><legend>${M?'Catat Barang Masuk (belanja / kulakan)':'Catat Barang Keluar (penjualan)'}</legend>
 <label>Tanggal</label><input id=td type=date value="${TD}" onchange="TD=this.value">
 <label>Barang *</label><select id=tb onchange="pick('${j}',this.value)"><option value="">- pilih barang -</option>${ks.map(k=>`<optgroup label="${esc(k)}">${db.barang.filter(x=>(x.kat||'Tanpa kategori')==k).map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${esc(x.nama)}</option>`).join('')}</optgroup>`).join('')}</select>
 <div class=m id=ti style="margin-top:4px">${b?'Stok saat ini: '+q(m[b.id].s)+' '+esc(b.satuan):''}</div>
 <div class=g><div><label>Jumlah *</label><input id=tj inputmode=decimal oninput=tot()></div><div><label>Harga ${M?'Beli':'Jual'} / satuan</label><input id=th inputmode=decimal value="${b?(M?b.beli:b.jual):''}" oninput=tot()></div></div>
 <label>Catatan${M?' / Supplier':''}</label><input id=tc>
 ${M?'<label class=c style="margin-top:12px"><input type=checkbox id=tu checked> Perbarui harga beli di data barang</label>':''}
 <div class=sum id=tt style="margin:12px 0;font-size:18px">Total: Rp 0</div><button onclick="simpanT('${j}')">Simpan Transaksi</button></fieldset>
 <p class=m>${last.length} transaksi terakhir</p>
 <div class=wrap><table style="min-width:560px"><tr><th>Tanggal<th>Nama Barang<th class=r>Jumlah<th class=r>Harga<th class=r>Total<th>Catatan</tr>
 ${last.map(t=>{const b=bn(t.bid);return `<tr><td>${t.tgl}<td><b>${esc(b.nama)}</b><br><small>${esc(b.kode)}</small><td class=r>${q(t.jml)} ${esc(b.satuan)}<td class=r>${rp(t.harga)}<td class=r>${rp(t.jml*t.harga)}<td>${esc(t.cat)}</tr>`}).join('')}</table></div>`}
V.M=()=>VT('M');V.K=()=>VT('K');
function pick(j,v){sel[j]=+v;const b=db.barang.find(x=>x.id==v);
 $('#th').value=b?(j=='M'?b.beli:b.jual):'';$('#ti').textContent=b?'Stok saat ini: '+q(stokMap()[b.id].s)+' '+b.satuan:'';tot()}
function tot(){$('#tt').textContent='Total: '+rp((num($('#tj').value)||0)*(num($('#th').value)||0))}
function simpanT(j){const b=db.barang.find(x=>x.id==sel[j]);if(!b)return alert('Pilih barang dulu.');
 const tgl=$('#td').value;if(!tgl)return alert('Isi tanggal dulu.');
 const jml=num($('#tj').value),h=num($('#th').value);
 if(isNaN(jml)||isNaN(h)||jml<=0)return alert('Jumlah harus berupa angka lebih dari 0.');
 const s=stokMap()[b.id].s;if(j=='K'&&jml>s)return alert('Stok tidak cukup. Sisa stok '+b.nama+' hanya '+q(s)+' '+b.satuan+'.');
 db.trx.push({id:db.seq++,tgl,jenis:j,bid:b.id,jml,harga:h,modal:j=='K'?b.beli:h,cat:$('#tc').value.trim()});
 if(j=='M'&&$('#tu').checked)b.beli=h;
 save();R();msg('Tersimpan. Sisa stok '+b.nama+': '+q(stokMap()[b.id].s)+' '+b.satuan)}

const FT=()=>db.trx.filter(t=>t.tgl>=rd&&t.tgl<=rs&&(!rj||t.jenis==rj)).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id);
V.riwayat=()=>{const L=FT();let i=0,o=0;L.forEach(t=>t.jenis=='M'?i+=t.jml*t.harga:o+=t.jml*t.harga);
 return `<fieldset><legend>Riwayat Transaksi</legend><div class=g><div><label>Dari</label><input type=date id=rd value="${rd}" onchange="rd=this.value;R()"></div><div><label>Sampai</label><input type=date id=rs value="${rs}" onchange="rs=this.value;R()"></div></div>
 <label>Jenis</label><select id=rj onchange="rj=this.value;R()"><option value="">Semua</option><option value=M ${rj=='M'?'selected':''}>Masuk</option><option value=K ${rj=='K'?'selected':''}>Keluar</option></select>
 <p class=sum>Pembelian: ${rp(i)} &nbsp;|&nbsp; Penjualan: ${rp(o)}</p>
 <div class=g><button class=s onclick=csv()>Export CSV</button><button class=d onclick=hapusT()>Hapus Terpilih</button></div></fieldset>
 <div class=wrap><table style="min-width:600px"><tr><th><th>Tanggal<th>Jenis<th>Nama Barang<th class=r>Jumlah<th class=r>Harga<th class=r>Total<th>Catatan</tr>
 ${L.map(t=>{const b=bn(t.bid),M=t.jenis=='M';return `<tr><td><input type=checkbox class=ck value=${t.id}><td>${t.tgl}<td class="${M?'in':'ou'}">${M?'MASUK':'KELUAR'}<td><b>${esc(b.nama)}</b><br><small>${esc(b.kode)}</small><td class=r>${q(t.jml)} ${esc(b.satuan)}<td class=r>${rp(t.harga)}<td class=r>${rp(t.jml*t.harga)}<td>${esc(t.cat)}</tr>`}).join('')}</table></div>${L.length?'':'<p class=m>Tidak ada transaksi pada pilihan ini.</p>'}`};
function hapusT(){const ids=$$('.ck:checked').map(c=>+c.value);if(!ids.length)return alert('Centang transaksi yang mau dihapus dulu.');
 if(confirm('Hapus '+ids.length+' transaksi? Stok akan menyesuaikan otomatis.')){db.trx=db.trx.filter(t=>!ids.includes(t.id));save();R()}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){const e=v=>'"'+String(v).replace(/"/g,'""')+'"';
 dl('riwayat_'+today()+'.csv','\ufeff'+['Tanggal,Jenis,Kode,Nama,Jumlah,Satuan,Harga,Total,Catatan'].concat(FT().map(t=>{const b=bn(t.bid);
 return [t.tgl,t.jenis=='M'?'MASUK':'KELUAR',b.kode,b.nama,t.jml,b.satuan,t.harga,t.jml*t.harga,t.cat].map(e).join(',')})).join('\n'),'text/csv')}

V.laporan=()=>{let j=0,mo=0,be=0,n=0;const top={};
 db.trx.filter(t=>t.tgl>=ld&&t.tgl<=ls).forEach(t=>{const v=t.jml*t.harga;if(t.jenis=='M')be+=v;else{n++;j+=v;mo+=t.jml*t.modal;const x=top[t.bid]=top[t.bid]||{o:0,q:0,l:0};x.o+=v;x.q+=t.jml;x.l+=t.jml*(t.harga-t.modal)}});
 const T=Object.entries(top).sort((a,b)=>b[1].o-a[1].o).slice(0,10),lb=j-mo,row=(a,b,c)=>`<tr><td>${a}<td class=r ${c?`style="color:var(--${c})"`:''}><b>${b}</b></tr>`;
 return `<fieldset><legend>Laporan</legend><div class=g><div><label>Dari</label><input type=date id=ld value="${ld}" onchange="ld=this.value;R()"></div><div><label>Sampai</label><input type=date id=ls value="${ls}" onchange="ls=this.value;R()"></div></div>
 <div class=g style="margin-top:10px"><button class=s onclick="ld=ls=today();R()">Hari ini</button><button class=s onclick="ld=ms();ls=today();R()">Bulan ini</button></div></fieldset>
 <table style="margin-bottom:16px">${row('Total Penjualan',rp(j))}${row('Modal Barang Terjual',rp(mo))}${row('Laba Kotor',rp(lb),lb<0?'no':'ok')}${row('Total Pembelian / Kulakan',rp(be))}${row('Jumlah Transaksi Penjualan',n)}</table>
 <p class=sum>10 barang terlaris (berdasarkan omzet)</p>
 <div class=wrap><table style="min-width:420px"><tr><th>Nama Barang<th class=r>Terjual<th class=r>Omzet<th class=r>Laba</tr>
 ${T.map(([id,x])=>{const b=bn(id);return `<tr><td>${esc(b.nama)}<td class=r>${q(x.q)} ${esc(b.satuan)}<td class=r>${rp(x.o)}<td class=r>${rp(x.l)}</tr>`}).join('')}</table></div>${T.length?'':'<p class=m>Belum ada penjualan pada periode ini.</p>'}`};

V.data=()=>`<fieldset><legend>Data dan Backup</legend>
 <p class=m>Data warung disimpan di browser HP ini saja, tidak dikirim ke internet. Jika data browser dihapus atau HP diganti, data ikut hilang, jadi lakukan backup secara berkala. Saat ini: ${db.barang.length} barang, ${db.trx.length} transaksi.</p>
 <button onclick=bk()>Backup (unduh file)</button>
 <label>Pulihkan dari file backup (.json)</label><input type=file accept=".json,application/json" onchange=restore(this)></fieldset>
 <fieldset><legend>Lainnya</legend><button class=s onclick=contoh()>Isi data contoh (untuk uji coba)</button><button class=d style="margin-top:10px" onclick=reset()>Hapus semua data</button></fieldset>`;
function bk(){dl('warung_backup_'+today()+'.json',JSON.stringify(db),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.barang)||!Array.isArray(d.trx))throw 0;
  if(!confirm('Data saat ini akan diganti dengan isi file backup. Lanjutkan?'))return;db=d;save();R();msg('Data berhasil dipulihkan.')}catch(e){alert('File backup tidak valid.')}};r.readAsText(f)}
function reset(){if(confirm('Hapus SEMUA barang dan transaksi? Tidak bisa dibatalkan.')){db={barang:[],trx:[],seq:1};save();R()}}
