<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<title>Data Warung</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1b1f;--m:#666;--p:#0b57d0;--pt:#fff;--b:#dde;--ok:#0a7d33;--no:#b3261e;--w:#fff3cd;--r:#f8d7da}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--c:#1e1e22;--t:#eee;--m:#aaa;--p:#8ab4f8;--pt:#000;--b:#333;--ok:#6dd58c;--no:#f2a19b;--w:#4a3f10;--r:#5c1f1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:76px}
header{background:var(--p);color:var(--pt);padding:12px;padding-top:calc(12px + env(safe-area-inset-top));font-weight:700}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 2px}
input,select,button{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{background:var(--p);color:var(--pt);border:0;font-weight:600}
button.s{background:transparent;color:var(--p);border:1px solid var(--p)}
button.d{background:#b3261e;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:7px 0;font-size:10px;color:var(--m)}
nav a b{display:block;font-size:18px;font-weight:400}
nav a.on{color:var(--p);font-weight:700}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--b)}
.it:last-child{border:0}
.low{background:var(--w)}.out{background:var(--r)}
small{color:var(--m)}.big{font-size:20px;font-weight:700}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
</style></head><body>
<header>🛒 Data Warung</header><main></main><nav></nav><div id="toast"></div>
<script>
const K='warung_v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{barang:[],trx:[],seq:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Gagal menyimpan. Penyimpanan browser penuh atau diblokir.')}};
const $=s=>document.querySelector(s);
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const q=n=>String(+(+n).toFixed(3));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{s=String(s).replace(/rp|\s/gi,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date()),ms=()=>today().slice(0,8)+'01';
const bn=id=>db.barang.find(x=>x.id==id)||{nama:'(dihapus)',satuan:''};
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2000)}
function stokMap(){const m={};db.barang.forEach(b=>m[b.id]={s:b.awal});db.trx.forEach(t=>{if(m[t.bid])m[t.bid].s+=t.jenis=='M'?t.jml:-t.jml});return m}

let tab='stok',fq='',fl=false,eb=null,rd=ms(),rs=today(),rj='',ld=ms(),ls=today();const sel={M:0,K:0},V={};
const TABS=[['stok','📦','Stok'],['barang','🏷️','Barang'],['M','⬇️','Masuk'],['K','⬆️','Keluar'],['riwayat','📜','Riwayat'],['laporan','📊','Laporan']];
$('nav').innerHTML=TABS.map(([k,i,t])=>`<a id="n_${k}" onclick="tab='${k}';R();scrollTo(0,0)"><b>${i}</b>${t}</a>`).join('');
function R(){const a=document.activeElement,id=a&&a.id;$('main').innerHTML=V[tab]();
 TABS.forEach(([k])=>$('#n_'+k).classList.toggle('on',k==tab));
 if(id){const e=document.getElementById(id);if(e){e.focus();try{const n=e.value.length;e.setSelectionRange(n,n)}catch(x){}}}}

// ---- STOK
V.stok=()=>{const m=stokMap();let nilai=0,low=0;
 const all=db.barang.map(b=>{const s=m[b.id].s,c=s<=0?'out':s<=b.min?'low':'';nilai+=Math.max(s,0)*b.beli;if(c)low++;return{b,s,c}});
 const L=all.filter(x=>(x.b.nama+x.b.kode).toLowerCase().includes(fq.toLowerCase())&&(!fl||x.c));
 return `<div class=card><div class=big>${rp(nilai)}</div><small>Nilai stok · ${all.length} barang · ${low} perlu restok</small></div>
 <input id=fq type=search placeholder="Cari barang..." value="${esc(fq)}" oninput="fq=this.value;R()">
 <label style="display:flex;gap:8px;align-items:center"><input type=checkbox style="width:auto" ${fl?'checked':''} onchange="fl=this.checked;R()"> Hanya stok menipis / habis</label>
 <div class=card style="padding:4px 6px">${L.map(x=>`<div class="it ${x.c}"><div><b>${esc(x.b.nama)}</b><br><small>Beli ${rp(x.b.beli)} · Jual ${rp(x.b.jual)}</small></div><div style="text-align:right"><b>${q(x.s)}</b> ${esc(x.b.satuan)}</div></div>`).join('')||'<p style="padding:6px"><small>Belum ada barang. Tambah di tab Barang, atau isi data contoh di tab Laporan.</small></p>'}</div>
 <small>Kuning = stok menipis · Merah = habis</small>`};

// ---- BARANG
V.barang=()=>{const b=db.barang.find(x=>x.id==eb)||{kode:'',nama:'',satuan:'pcs',beli:'',jual:'',awal:'',min:''};
 return `<div class=card><b>${eb?'Edit barang':'Tambah barang'}</b>
 <label>Nama barang *</label><input id=bn value="${esc(b.nama)}">
 <div class=row><div><label>Kode (boleh kosong)</label><input id=bk value="${esc(b.kode)}"></div><div><label>Satuan</label><input id=bs list=sat value="${esc(b.satuan)}"></div></div>
 <datalist id=sat>${['pcs','bungkus','sachet','botol','kg','liter','dus','pak','butir'].map(s=>`<option>${s}</option>`).join('')}</datalist>
 <div class=row><div><label>Harga beli</label><input id=bb inputmode=decimal value="${b.beli}"></div><div><label>Harga jual</label><input id=bj inputmode=decimal value="${b.jual}"></div></div>
 <div class=row><div><label>Stok awal</label><input id=ba inputmode=decimal value="${b.awal}"></div><div><label>Stok minimum</label><input id=bm inputmode=decimal value="${b.min}"></div></div>
 <div class=row style="margin-top:10px"><button onclick=simpanB()>Simpan</button>${eb?'<button class=s onclick="eb=null;R()">Batal</button><button class=d onclick=hapusB()>Hapus</button>':''}</div></div>
 <div class=card style="padding:4px 6px">${db.barang.map(x=>`<div class=it onclick="eb=${x.id};R();scrollTo(0,0)"><div><b>${esc(x.nama)}</b><br><small>${esc(x.kode)} · ${esc(x.satuan)}</small></div><div style="text-align:right">${rp(x.jual)}<br><small>beli ${rp(x.beli)}</small></div></div>`).join('')}</div>`};
function simpanB(){const nama=$('#bn').value.trim();if(!nama)return alert('Nama barang wajib diisi');
 const beli=num($('#bb').value),jual=num($('#bj').value),awal=num($('#ba').value),min=num($('#bm').value);
 if([beli,jual,awal,min].some(isNaN))return alert('Harga dan stok harus berupa angka');
 const kode=$('#bk').value.trim().toUpperCase()||'BRG'+String(db.seq).padStart(4,'0');
 if(db.barang.some(x=>x.kode==kode&&x.id!=eb))return alert('Kode sudah dipakai barang lain');
 const d={kode,nama,satuan:$('#bs').value.trim()||'pcs',beli,jual,awal,min};
 if(eb)Object.assign(db.barang.find(x=>x.id==eb),d);else db.barang.push({id:db.seq++,...d});
 db.barang.sort((a,b)=>a.nama.localeCompare(b.nama));eb=null;save();R();toast('Barang tersimpan')}
function hapusB(){if(!confirm('Hapus barang ini beserta semua transaksinya?'))return;
 db.barang=db.barang.filter(x=>x.id!=eb);db.trx=db.trx.filter(t=>t.bid!=eb);eb=null;save();R()}

// ---- MASUK / KELUAR
function rowT(t,del){const b=bn(t.bid),M=t.jenis=='M';
 return `<div class=it><div><b>${esc(b.nama)}</b><br><small>${t.tgl}${t.cat?' · '+esc(t.cat):''}</small></div><div style="text-align:right;color:var(--${M?'ok':'no'})"><b>${M?'+':'−'}${q(t.jml)} ${esc(b.satuan)}</b><br><small>${rp(t.jml*t.harga)}</small>${del?` <a onclick="delT(${t.id})">🗑️</a>`:''}</div></div>`}
function VT(j){const m=stokMap(),M=j=='M',id=sel[j],b=db.barang.find(x=>x.id==id);
 const last=db.trx.filter(t=>t.jenis==j).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id).slice(0,15);
 return `<div class=card><b>${M?'Barang masuk (kulakan)':'Barang keluar (penjualan)'}</b>
 <label>Tanggal</label><input id=td type=date value="${today()}">
 <label>Barang *</label><select id=tb onchange="pick('${j}',this.value)"><option value="">— pilih barang —</option>${db.barang.map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>
 <small id=ti>${b?'Stok saat ini: '+q(m[b.id].s)+' '+esc(b.satuan):''}</small>
 <div class=row><div><label>Jumlah *</label><input id=tj inputmode=decimal oninput=tot()></div><div><label>Harga ${M?'beli':'jual'} / satuan</label><input id=th inputmode=decimal value="${b?(M?b.beli:b.jual):''}" oninput=tot()></div></div>
 <label>Catatan${M?' / supplier':''}</label><input id=tc>
 <div class=big id=tt style="margin:10px 0">Total: Rp 0</div><button onclick="simpanT('${j}')">Simpan</button></div>
 <small>15 transaksi terakhir</small><div class=card style="padding:4px 6px">${last.map(t=>rowT(t)).join('')||'<p style="padding:6px"><small>Belum ada.</small></p>'}</div>`}
V.M=()=>VT('M');V.K=()=>VT('K');
function pick(j,v){sel[j]=+v;const b=db.barang.find(x=>x.id==v);
 $('#th').value=b?(j=='M'?b.beli:b.jual):'';$('#ti').textContent=b?'Stok saat ini: '+q(stokMap()[b.id].s)+' '+b.satuan:'';tot()}
function tot(){$('#tt').textContent='Total: '+rp((num($('#tj').value)||0)*(num($('#th').value)||0))}
function simpanT(j){const b=db.barang.find(x=>x.id==sel[j]);if(!b)return alert('Pilih barang dulu');
 const tgl=$('#td').value;if(!tgl)return alert('Isi tanggal');
 const jml=num($('#tj').value),h=num($('#th').value);
 if(isNaN(jml)||isNaN(h)||jml<=0)return alert('Jumlah harus angka lebih dari 0');
 const s=stokMap()[b.id].s;if(j=='K'&&jml>s)return alert('Stok tidak cukup. Sisa '+q(s)+' '+b.satuan);
 db.trx.push({id:db.seq++,tgl,jenis:j,bid:b.id,jml,harga:h,modal:j=='K'?b.beli:h,cat:$('#tc').value.trim()});
 if(j=='M')b.beli=h;
 save();R();toast('Tersimpan. Sisa stok '+q(stokMap()[b.id].s)+' '+b.satuan)}

// ---- RIWAYAT
const FT=()=>db.trx.filter(t=>t.tgl>=rd&&t.tgl<=rs&&(!rj||t.jenis==rj)).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id);
V.riwayat=()=>{const L=FT();let i=0,o=0;L.forEach(t=>t.jenis=='M'?i+=t.jml*t.harga:o+=t.jml*t.harga);
 return `<div class=card><div class=row><div><label>Dari</label><input type=date id=rd value="${rd}" onchange="rd=this.value;R()"></div><div><label>Sampai</label><input type=date id=rs value="${rs}" onchange="rs=this.value;R()"></div></div>
 <label>Jenis</label><select id=rj onchange="rj=this.value;R()"><option value="">Semua</option><option value=M ${rj=='M'?'selected':''}>Masuk</option><option value=K ${rj=='K'?'selected':''}>Keluar</option></select>
 <p><small>Pembelian ${rp(i)} · Penjualan ${rp(o)}</small></p><button class=s onclick=csv()>Export CSV</button></div>
 <div class=card style="padding:4px 6px">${L.map(t=>rowT(t,1)).join('')||'<p style="padding:6px"><small>Tidak ada transaksi.</small></p>'}</div>`};
function delT(id){if(confirm('Hapus transaksi ini? Stok akan menyesuaikan.')){db.trx=db.trx.filter(t=>t.id!=id);save();R()}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){const e=v=>'"'+String(v).replace(/"/g,'""')+'"';
 dl('riwayat_'+today()+'.csv','\ufeff'+['Tanggal,Jenis,Kode,Nama,Jumlah,Satuan,Harga,Total,Catatan'].concat(FT().map(t=>{const b=bn(t.bid);
 return [t.tgl,t.jenis=='M'?'MASUK':'KELUAR',b.kode||'',b.nama,t.jml,b.satuan,t.harga,t.jml*t.harga,t.cat].map(e).join(',')})).join('\n'),'text/csv')}

// ---- LAPORAN + DATA
V.laporan=()=>{let j=0,mo=0,be=0,n=0;const top={};
 db.trx.filter(t=>t.tgl>=ld&&t.tgl<=ls).forEach(t=>{const v=t.jml*t.harga;if(t.jenis=='M')be+=v;else{n++;j+=v;mo+=t.jml*t.modal;const x=top[t.bid]=top[t.bid]||{o:0,q:0};x.o+=v;x.q+=t.jml}});
 const T=Object.entries(top).sort((a,b)=>b[1].o-a[1].o).slice(0,10),lb=j-mo;
 return `<div class=card><b>Laporan</b><div class=row><div><label>Dari</label><input type=date id=ld value="${ld}" onchange="ld=this.value;R()"></div><div><label>Sampai</label><input type=date id=ls value="${ls}" onchange="ls=this.value;R()"></div></div>
 <div class=it><span>Penjualan</span><b>${rp(j)}</b></div><div class=it><span>Modal barang terjual</span><b>${rp(mo)}</b></div>
 <div class=it><span>Laba kotor</span><b style="color:var(--${lb<0?'no':'ok'})">${rp(lb)}</b></div>
 <div class=it><span>Total kulakan</span><b>${rp(be)}</b></div><div class=it><span>Transaksi penjualan</span><b>${n}</b></div></div>
 <div class=card style="padding:4px 6px"><b style="display:block;padding:8px 6px">Terlaris (omzet)</b>${T.map(([id,x])=>{const b=bn(id);return `<div class=it><span>${esc(b.nama)}<br><small>${q(x.q)} ${esc(b.satuan)}</small></span><b>${rp(x.o)}</b></div>`}).join('')||'<p style="padding:6px"><small>Belum ada penjualan di periode ini.</small></p>'}</div>
 <div class=card><b>Data &amp; backup</b><p><small>Data hanya tersimpan di browser HP ini. Backup rutin, terutama sebelum hapus data browser.</small></p>
 <button onclick=bk()>Backup (unduh file)</button>
 <label>Pulihkan dari file backup (.json)</label><input type=file accept=".json,application/json" onchange=restore(this)>
 <button class=s style="margin-top:10px" onclick=contoh()>Isi data contoh</button>
 <button class=d style="margin-top:10px" onclick=reset()>Hapus semua data</button></div>`};
function bk(){dl('warung_backup_'+today()+'.json',JSON.stringify(db),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.barang)||!Array.isArray(d.trx))throw 0;
  if(!confirm('Data saat ini akan diganti dengan isi backup. Lanjut?'))return;db=d;save();R();toast('Data dipulihkan')}catch(e){alert('File backup tidak valid')}};r.readAsText(f)}
function reset(){if(confirm('Hapus SEMUA barang dan transaksi? Tidak bisa dibatalkan.')){db={barang:[],trx:[],seq:1};save();R()}}
function contoh(){if(db.barang.length&&!confirm('Data saat ini akan diganti data contoh. Lanjut?'))return;
 const B=[['Indomie Goreng','bungkus',2900,3500,40,20,8],['Beras','kg',12500,14000,50,15,5],['Gula Pasir','kg',15000,17000,20,5,2],['Minyak Goreng 1L','botol',16500,18500,24,6,2],['Telur Ayam','kg',27000,30000,10,4,2],['Kopi Sachet','sachet',1200,1500,100,30,10],['Aqua 600ml','botol',3000,4000,48,12,6],['Roti Tawar','bungkus',14000,16500,6,3,2]];
 db={barang:[],trx:[],seq:1};const st={};
 B.forEach(([nama,satuan,beli,jual,awal,min,avg],i)=>{const b={id:db.seq++,kode:'BRG'+String(i+1).padStart(4,'0'),nama,satuan,beli,jual,awal,min};db.barang.push(b);st[b.id]={s:awal,avg}});
 const add=(tgl,jenis,b,jml,harga,cat)=>{db.trx.push({id:db.seq++,tgl,jenis,bid:b.id,jml,harga,modal:b.beli,cat});st[b.id].s+=jenis=='M'?jml:-jml};
 for(let d=20;d>=0;d--){const t=new Date();t.setDate(t.getDate()-d);const tgl=iso(t);
  db.barang.forEach(b=>{const s=st[b.id];if(s.s<=b.min)add(tgl,'M',b,b.min*3,b.beli,'Kulakan');
   let n=Math.round(s.avg*(.5+Math.random()));if(n>s.s)n=Math.floor(s.s);if(n>0)add(tgl,'K',b,n,b.jual,'')})}
 db.barang.sort((a,b)=>a.nama.localeCompare(b.nama));save();R();toast('Data contoh dibuat')}

R();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
